<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أبشر العراق 🇮🇶</title>
<style>
:root{--red:#b5121b;--bg:#fff7f7;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif;}
body{background:var(--bg);color:#241719;padding-bottom:70px;}
.hidden{display:none!important;}
#welcome{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;color:white;background:linear-gradient(145deg,#75070e,#b5121b,#e3262e);}
.welcome-box{width:90%;max-width:400px;}
.logo{width:100px;height:100px;margin:0 auto 20px;display:grid;place-items:center;background:white;color:var(--red);border-radius:30px;font-size:3rem;box-shadow:0 10px 30px #0003;}
.enter-btn{border:0;background:white;color:var(--red);padding:14px 35px;border-radius:15px;font-weight:bold;font-size:1.1rem;cursor:pointer;box-shadow:0 10px 25px #0003;}
header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd;z-index:1000;}
.page{display:none;padding:15px;}
.page.active{display:block;}
.card{background:white;border:1px solid #ddd;border-radius:15px;padding:15px;margin-bottom:15px;}
.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--red);color:white;font-weight:bold;cursor:pointer;margin-top:10px;}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;}
.nav{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;background:white;border-top:1px solid #ddd;z-index:2000;}
.nav div{flex:1;text-align:center;padding-top:10px;font-size:12px;cursor:pointer;color:#777;}
.nav div.active{color:var(--red);font-weight:bold;}
</style>
</head>
<body>

<div id="welcome">
    <div class="welcome-box">
        <div class="logo">🇮🇶</div>
        <h1>أبشر العراق</h1>
        <p style="margin:10px 0 20px;">كل احتياجاتك بمكان واحد</p>
        <button class="enter-btn" onclick="enterApp()">اضغط للدخول</button>
    </div>
</div>

<header id="header" class="hidden">
    <h2>🇮🇶 أبشر العراق</h2>
</header>

<main id="app" class="hidden">
    <section id="home" class="page active">
        <div class="card">
            <h3>مميزات التطبيق</h3>
            <p>أهلاً بك، التطبيق جاهز ويعمل بكفاءة عالية.</p>
        </div>
    </section>

    <section id="auth" class="page">
        <div class="card">
            <h3>حسابي</h3>
            <label>الاسم</label>
            <input id="nameInput" placeholder="أدخل اسمك">
            <label>رقم الهاتف</label>
            <input id="phoneInput" placeholder="07XXXXXXXX">
            <button class="btn" onclick="saveUser()">حفظ وحفظ البيانات</button>
        </div>
    </section>
</main>

<nav id="nav" class="nav hidden">
    <div id="n-home" class="active" onclick="go('home')">🏠 الرئيسية</div>
    <div id="n-auth" onclick="go('auth')">👤 حسابي</div>
</nav>

<script>
function enterApp() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("header").classList.remove("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("nav").classList.remove("hidden");
    
    // إذا ماكو مستخدم مخزن، وجهه لحسابي
    if(!localStorage.getItem("absher_user")) {
        go('auth');
    }
}

function go(page) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
    
    document.querySelectorAll(".nav div").forEach(n => n.classList.remove("active"));
    const nav = document.getElementById("n-" + page);
    if(nav) nav.classList.add("active");
}

function saveUser() {
    const name = document.getElementById("nameInput").value;
    const phone = document.getElementById("phoneInput").value;
    if(!name || !phone) {
        alert("يرجى ملء الحقول");
        return;
    }
    localStorage.setItem("absher_user", JSON.stringify({name, phone}));
    alert("تم الحفظ بنجاح!");
    go('home');
}
</script>

</body>
</html>
