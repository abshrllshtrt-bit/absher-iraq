<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أبشر العراق 🇮🇶</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--red:#b5121b;--red-dark:#850b12;--red-light:#ffe8ea;--bg:#fff7f7;--text:#241719;--muted:#76696b;--border:#efdfe1;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);padding-bottom:75px;}
.hidden{display:none!important;}

#welcome{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;color:white;background:linear-gradient(145deg,#75070e,#b5121b,#e3262e);}
.welcome-box{width:90%;max-width:400px;}
.logo{width:100px;height:100px;margin:0 auto 20px;display:grid;place-items:center;background:white;color:var(--red);border-radius:30px;font-size:3rem;box-shadow:0 10px 30px #0003;}
.enter-btn{border:0;background:white;color:var(--red);padding:14px 35px;border-radius:15px;font-weight:bold;font-size:1.1rem;cursor:pointer;box-shadow:0 10px 25px #0003;}

header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid var(--border);z-index:1000;}
.page{display:none;padding:15px;}
.page.active{display:block;}

.card{background:white;border:1px solid var(--border);border-radius:20px;padding:15px;margin-bottom:15px;box-shadow:0 5px 15px #b5121b08;}
.btn{width:100%;border:0;border-radius:12px;padding:12px;background:var(--red);color:white;font-weight:bold;cursor:pointer;margin-top:10px;}
.btn.red{background:var(--red-dark);}
input,select{width:100%;padding:11px;margin:8px 0;border:1px solid var(--border);border-radius:10px;background:#fffafa;outline:0;}

.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px;}
.cat{text-align:center;cursor:pointer;background:white;padding:10px;border-radius:15px;border:1px solid var(--border);}
.cat i{font-style:normal;font-size:1.5rem;display:block;}
.cat b{font-size:0.75rem;margin-top:5px;display:block;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.product{background:white;border:1px solid var(--border);border-radius:15px;padding:10px;text-align:center;}
.pic{height:90px;display:grid;place-items:center;background:var(--red-light);border-radius:10px;font-size:2rem;margin-bottom:8px;}
.price{color:var(--red);font-weight:bold;margin:5px 0;}

.nav{position:fixed;bottom:0;left:0;right:0;height:65px;display:flex;background:white;border-top:1px solid var(--border);z-index:2000;}
.nav div{flex:1;text-align:center;padding-top:10px;font-size:0.75rem;cursor:pointer;color:var(--muted);font-weight:bold;}
.nav div.active{color:var(--red);}
.nav span{display:block;font-size:1.2rem;margin-bottom:2px;}

.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);background:#241719;color:white;padding:10px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:0.3s;z-index:5000;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}
#map{width:100%;height:250px;border-radius:15px;margin:10px 0;}
</style>
</head>
<body>

<div id="welcome">
    <div class="welcome-box">
        <div class="logo">🇮🇶</div>
        <h1>أبشر العراق</h1>
        <p style="margin:10px 0 20px;">كل احتياجاتك بمكان واحد</p>
        <button class="enter-btn" onclick="enterApp()">اضغط للدخول</button>
    </div>
</div>

<header id="header" class="hidden">
    <h3 style="color:var(--red)">🇮🇶 أبشر العراق</h3>
</header>

<main id="app" class="hidden">
    <!-- الرئيسية -->
    <section id="home" class="page active">
        <div class="card" id="userChip"></div>
        
        <h4 style="color:var(--red);margin-bottom:10px">الأقسام الرئيسية</h4>
        <div class="categories">
            <div class="cat" onclick="category('الكوزمتك والجمال','💄')"><i>💄</i><b>كوزمتك</b></div>
            <div class="cat" onclick="category('المطاعم','🍔')"><i>🍔</i><b>مطاعم</b></div>
            <div class="cat" onclick="category('الخضروات والفواكه','🥦')"><i>🥦</i><b>خضروات</b></div>
            <div class="cat" onclick="go('taxi')"><i>🚕</i><b>تكسي</b></div>
        </div>

        <h4 style="color:var(--red);margin-bottom:10px">منتجات مميزة</h4>
        <div class="grid" id="featured"></div>
    </section>

    <!-- الأقسام -->
    <section id="category" class="page">
        <h3 id="catTitle" style="color:var(--red);margin-bottom:10px"></h3>
        <div id="catStores" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>

    <!-- المتجر -->
    <section id="store" class="page">
        <div class="card"><h3 id="storeTitle"></h3></div>
        <div class="grid" id="storeProducts"></div>
    </section>

    <!-- السلة -->
    <section id="cart" class="page">
        <div class="card" id="cartBox"></div>
    </section>

    <!-- الطلبات -->
    <section id="orders" class="page">
        <div class="card" id="ordersBox"></div>
    </section>

    <!-- الحساب -->
    <section id="auth" class="page">
        <div class="card">
            <h3>👤 حسابي</h3>
            <label>الاسم</label>
            <input id="nameInput" placeholder="أدخل اسمك الثلاثي">
            <label>رقم الهاتف</label>
            <input id="phoneInput" placeholder="07XXXXXXXX">
            <button class="btn" onclick="saveUser()">حفظ البيانات</button>
        </div>
    </section>

    <!-- التكسي -->
    <section id="taxi" class="page">
        <div class="card">
            <h3>🚕 طلب تكسي</h3>
            <label>من</label><input id="from" placeholder="موقع الانطلاق">
            <label>إلى</label><input id="to" placeholder="الوجهة">
            <button class="btn" onclick="taxiOrder()">إرسال الطلب</button>
        </div>
    </section>

    <!-- الموقع -->
    <section id="location" class="page">
        <div class="card">
            <h3>📍 موقعي</h3>
            <div id="map"></div>
            <button class="btn" onclick="gps()">تحديد موقعي GPS</button>
        </div>
    </section>
</main>

<nav id="nav" class="nav hidden">
    <div id="n-home" class="active" onclick="go('home')"><span>🏠</span>الرئيسية</div>
    <div id="n-category" onclick="go('category')"><span>🔲</span>الأقسام</div>
    <div id="n-cart" onclick="go('cart')"><span>🛒</span>السلة</div>
    <div id="n-orders" onclick="go('orders')"><span>📦</span>طلباتي</div>
    <div id="n-auth" onclick="go('auth')"><span>👤</span>حسابي</div>
</nav>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
    apiKey: "AIzaSyBrfnNSW9SjxHiDd7NEb89K3CoCrS1Oe88",
    authDomain: "dkfk-c286c.firebaseapp.com",
    projectId: "dkfk-c286c",
    storageBucket: "dkfk-c286c.firebasestorage.app",
    messagingSenderId: "716392390350",
    appId: "1:716392390350:web:fb6abc7b85757e40fdba9f"
}));

const data = {
    "الكوزمتك والجمال": [{name:"كوزمتك حسين",desc:"مستحضرات تجميل",icon:"💄"}],
    "المطاعم": [{name:"مطعم الطيبين",desc:"وجبات عراقية",icon:"🍗"}],
    "الخضروات والفواكه": [{name:"سوق الخيرات",desc:"خضروات طازجة",icon:"🥦"}]
};

const products = {
    "كوزمتك حسين": [{name:"عطر نسائي",price:15000,icon:"🌸"}],
    "مطعم الطيبين": [{name:"كباب عراقي",price:10000,icon:"🍢"}],
    "سوق الخيرات": [{name:"طماطة",price:2000,icon:"🍅"}]
};

window.toast = (msg) => {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
}

window.enterApp = () => {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("header").classList.remove("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("nav").classList.remove("hidden");
    updateUserChip();
    if(!localStorage.getItem("absher_user")) go('auth');
}

window.go = (page) => {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
    document.querySelectorAll(".nav div").forEach(n => n.classList.remove("active"));
    document.getElementById("n-" + page).classList.add("active");
    if(page === 'cart') renderCart();
    if(page === 'orders') renderOrders();
    if(page === 'location') setTimeout(initMap, 100);
    window.scrollTo({top:0, behavior:'smooth'});
}

window.saveUser = () => {
    const name = document.getElementById("nameInput").value;
    const phone = document.getElementById("phoneInput").value;
    if(!name || !phone) { toast("أدخل الاسم والرقم"); return; }
    localStorage.setItem("absher_user", JSON.stringify({name, phone}));
    updateUserChip();
    toast("تم الحفظ بنجاح");
    go('home');
}

function updateUserChip() {
    const user = JSON.parse(localStorage.getItem("absher_user") || "null");
    if(user) document.getElementById("userChip").innerHTML = `<strong>👤 ${user.name}</strong><br><small>📞 ${user.phone}</small>`;
}

window.category = (name, icon) => {
    document.getElementById("catTitle").textContent = icon + " " + name;
    const box = document.getElementById("catStores");
    box.innerHTML = "";
    (data[name] || []).forEach(s => {
        box.innerHTML += `<div class="card" onclick="openStore('${s.name}')" style="cursor:pointer"><strong>${s.icon} ${s.name}</strong><br><small>${s.desc}</small></div>`;
    });
    go('category');
}

window.openStore = (name) => {
    document.getElementById("storeTitle").textContent = "🏪 " + name;
    const box = document.getElementById("storeProducts");
    box.innerHTML = "";
    (products[name] || []).forEach((p, idx) => {
        box.innerHTML += `<div class="product"><div class="pic">${p.icon}</div><strong>${p.name}</strong><div class="price">${p.price} د.ع</div><button class="btn" onclick="addCart('${name}', ${idx})">أضف للسلة</button></div>`;
    });
    go('store');
}

let cart = JSON.parse(localStorage.getItem("absher_cart") || "[]");
window.addCart = (store, idx) => {
    const p = products[store][idx];
    cart.push({...p, store});
    localStorage.setItem("absher_cart", JSON.stringify(cart));
    toast("تمت الإضافة للسلة 🛒");
}

function renderCart() {
    const box = document.getElementById("cartBox");
    if(!cart.length) { box.innerHTML = "السلة فارغة"; return; }
    let html = "<h3>🛒 السلة</h3>";
    cart.forEach(i => html += `<div>${i.icon} ${i.name} - ${i.price} د.ع</div>`);
    html += `<button class="btn" onclick="checkout()">إرسال الطلب للـ Firebase</button>`;
    box.innerHTML = html;
}

window.checkout = async () => {
    const user = JSON.parse(localStorage.getItem("absher_user"));
    if(!user) { go('auth'); return; }
    await addDoc(collection(db, "requests"), {fullName: user.name, phoneNumber: user.phone, serviceType: "مشتريات سلة", timestamp: new Date()});
    cart = []; localStorage.removeItem("absher_cart");
    toast("تم إرسال الطلب بنجاح ✅");
    go('orders');
}

window.taxiOrder = async () => {
    const user = JSON.parse(localStorage.getItem("absher_user"));
    if(!user) { go('auth'); return; }
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    await addDoc(collection(db, "requests"), {fullName: user.name, phoneNumber: user.phone, serviceType: `تكسي من ${from} إلى ${to}`, timestamp: new Date()});
    toast("تم إرسال طلب التكسي 🚕");
    go('orders');
}

async function renderOrders() {
    const box = document.getElementById("ordersBox");
    box.innerHTML = "جاري التحميل...";
    const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
    const snap = await getDocs(q);
    let html = "<h3>📦 طلباتي</h3>";
    snap.forEach(d => {
        const data = d.data();
        html += `<div style="border-bottom:1px solid #ddd;padding:5px 0"><strong>${data.fullName}</strong><br>${data.serviceType}<br><small>${data.phoneNumber}</small></div>`;
    });
    box.innerHTML = html;
}

// المنتجات المميزة بالرئيسية
const featBox = document.getElementById("featured");
featBox.innerHTML = `<div class="product"><div class="pic">🍢</div><strong>كباب عراقي</strong><div class="price">10000 د.ع</div><button class="btn" onclick="openStore('مطعم الطيبين')">عرض المتجر</button></div>`;

let map, marker;
window.initMap = () => {
    if(map) { map.invalidateSize(); return; }
    map = L.map('map').setView([31.056, 46.257], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([31.056, 46.257]).addTo(map);
}
window.gps = () => {
    navigator.geolocation?.getCurrentPosition(pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 16);
        marker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
        toast("تم تحديد موقعك 📍");
    });
}
</script>
</body>
</html>
