<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التوصيل - Delivery App</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #d9534f; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #c9302c; }
    </style>
</head>
<body>

    <div class="container">
        <h2>خدمة التوصيل السريع</h2>
        <p>اطلب وسيوصلك طلبك لحد باب البيت</p>
        
        <form id="requestForm">
            <input type="text" id="fullName" placeholder="اسم الزبون الكامل" required>
            <input type="tel" id="phoneNumber" placeholder="رقم الهاتف" required>
            <input type="text" id="serviceType" placeholder="تفاصيل الطلب (العنوان / الوجبة)" required>
            <button type="submit">إرسال الطلب الآن</button>
        </form>
        <p id="statusMsg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrfnNSW9SjxHiDd7NEb89K3CoCrS1Oe88",
            authDomain: "dkfk-c286c.firebaseapp.com",
            projectId: "dkfk-c286c",
            storageBucket: "dkfk-c286c.firebasestorage.app",
            messagingSenderId: "716392390350",
            appId: "1:716392390350:web:fb6abc7b85757e40fdba9f",
            measurementId: "G-EMX5BDQRFF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('requestForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const serviceType = document.getElementById('serviceType').value;

            try {
                await addDoc(collection(db, "requests"), {
                    fullName: fullName,
                    phoneNumber: phoneNumber,
                    serviceType: serviceType,
                    timestamp: new Date()
                });
                statusMsg.style.color = "green";
                statusMsg.textContent = "تم تسجيل طلب التوصيل بنجاح!";
                form.reset();
            } catch (error) {
                statusMsg.style.color = "red";
                statusMsg.textContent = "حدث خطأ، حاول مرة أخرى.";
                console.error("Error adding document: ", error);
            }
        });
    </script>
</body>
</html>
